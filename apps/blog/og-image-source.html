<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: linear-gradient(135deg, #FFF0F3 0%, #FFE1E9 55%, #FFC3D3 100%);

  .circle { position: absolute; border-radius: 50%; background: #FF8FB1; }
  .c1 { width: 380px; height: 380px; right: -110px; top: -120px; opacity: .28; }
  .c2 { width: 300px; height: 300px; left: -90px; bottom: -110px; opacity: .22; }
  .c3 { width: 120px; height: 120px; right: 180px; bottom: 60px; opacity: .35; background: #4ECDC4; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center; padding: 0 96px; }
  .logo { height: 72px; margin-bottom: 44px; }
  h1 { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700;
    font-size: 72px; line-height: 1.08; color: #212529; letter-spacing: -1px; max-width: 1010px; }
  h1 .hl { color: #E5647A; }
  p { margin-top: 26px; font-size: 32px; font-weight: 500; color: #495057; max-width: 780px; }
  .pill { position: absolute; right: 96px; bottom: 64px; background: #212529; color: #fff;
    font-weight: 600; font-size: 26px; padding: 18px 34px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
  <div class="wrap">
    <img class="logo" src="file:///Users/madu/Developer/mine/paca/apps/blog/public/logo-full.png" alt="">
    <h1>Finanças para casais, <span class="hl">sem briga</span> e sem planilha</h1>
    <p>Guias práticos para organizar o dinheiro a dois</p>
  </div>
  <div class="pill">blog · Paca Finance</div>
</body>
</html>
